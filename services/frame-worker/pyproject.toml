[project]
name = "frame-intelligence-worker"
version = "0.1.0"
description = "Frame processing worker for the Frame Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27.0",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "scikit-image>=0.25.2",
    "yt-dlp[curl-cffi]>=2025.1.15",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
