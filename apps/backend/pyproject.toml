[project]
name = "frame-intelligence-api"
version = "0.1.0"
description = "Backend API for the Frame Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "cryptography>=45",
    "fastapi[standard]",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
