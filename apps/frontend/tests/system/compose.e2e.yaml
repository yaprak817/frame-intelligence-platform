services:
  frontend:
    container_name: !reset null
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_PUBLIC_ORIGIN: "http://${FULL_STACK_E2E_PUBLIC_HOST:-127.0.0.1}:${FULL_STACK_E2E_FRONTEND_PORT}"
    ports: !override
      - "127.0.0.1:${FULL_STACK_E2E_FRONTEND_PORT}:3000"
    restart: "no"

  backend:
    container_name: !reset null
    ports: !reset []
    restart: "no"

  outbox-publisher:
    container_name: !reset null
    restart: "no"

  frame-worker:
    container_name: !reset null
    restart: "no"

  ml-worker:
    container_name: !reset null
    restart: "no"

  postgres:
    container_name: !reset null
    ports: !reset []
    restart: "no"

  redis:
    container_name: !reset null
    ports: !reset []
    restart: "no"

  minio:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${FULL_STACK_E2E_MINIO_PORT}:9000"
    restart: "no"

  minio-init:
    restart: "no"
