services:
  postgres:
    image: postgres:17-alpine
    container_name: frame-intelligence-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frame_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-frame_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-frame_user} -d ${POSTGRES_DB:-frame_intelligence}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: frame-intelligence-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: frame-intelligence-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-frame_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        ${MINIO_ROOT_USER:-frame_admin} ${MINIO_ROOT_PASSWORD:-change_me} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-frame-intelligence} &&
        mc anonymous set none local/${MINIO_BUCKET:-frame-intelligence}
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
