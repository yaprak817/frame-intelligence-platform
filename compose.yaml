services:
  frontend:
    build:
      context: ./apps/frontend
    container_name: frame-intelligence-frontend
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES:-2147483648}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
    container_name: frame-intelligence-backend
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &backend-environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frame_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-frame_intelligence}
      JOB_SOURCE_ENCRYPTION_KEY: ${JOB_SOURCE_ENCRYPTION_KEY}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-[]}
      RATE_LIMIT_SUBMISSION_REQUESTS: ${RATE_LIMIT_SUBMISSION_REQUESTS:-10}
      RATE_LIMIT_RESULT_REQUESTS: ${RATE_LIMIT_RESULT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      FRAME_EXPORT_MAX_FRAMES: ${FRAME_EXPORT_MAX_FRAMES:-1000}
      FRAME_EXPORT_MAX_TOTAL_BYTES: ${FRAME_EXPORT_MAX_TOTAL_BYTES:-2147483648}
      IMAGE_DATASET_MAX_FILES: ${IMAGE_DATASET_MAX_FILES:-1000}
      IMAGE_DATASET_MAX_FILE_BYTES: ${IMAGE_DATASET_MAX_FILE_BYTES:-52428800}
      IMAGE_DATASET_MAX_TOTAL_BYTES: ${IMAGE_DATASET_MAX_TOTAL_BYTES:-2147483648}
      IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES:-2147483648}
      RESULT_ARTIFACT_SPOOL_MIN_FREE_BYTES: ${RESULT_ARTIFACT_SPOOL_MIN_FREE_BYTES:-268435456}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_EXTERNAL_ENDPOINT: ${OBJECT_STORAGE_EXTERNAL_ENDPOINT:-http://localhost:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-frame_admin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-frame-intelligence}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ADDRESSING_STYLE: ${OBJECT_STORAGE_ADDRESSING_STYLE:-path}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_BACKOFF_BASE_SECONDS: ${OUTBOX_BACKOFF_BASE_SECONDS:-1}
      OUTBOX_BACKOFF_MAX_SECONDS: ${OUTBOX_BACKOFF_MAX_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  outbox-publisher:
    build:
      context: ./apps/backend
    container_name: frame-intelligence-outbox-publisher
    command: ["python", "-m", "app.outbox.publisher"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frame-worker:
    build:
      context: ./services/frame-worker
    container_name: frame-intelligence-frame-worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frame_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-frame_intelligence}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      JOB_SOURCE_ENCRYPTION_KEY: ${JOB_SOURCE_ENCRYPTION_KEY}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-frame_admin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-frame-intelligence}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ADDRESSING_STYLE: ${OBJECT_STORAGE_ADDRESSING_STYLE:-path}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-2147483648}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-900}
      JOB_HEARTBEAT_INTERVAL_SECONDS: ${JOB_HEARTBEAT_INTERVAL_SECONDS:-60}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-7200}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      PROCESSING_TEMP_ROOT: /tmp/frame-intelligence
      FRAME_EXPORT_LEASE_SECONDS: ${FRAME_EXPORT_LEASE_SECONDS:-300}
      FRAME_EXPORT_HEARTBEAT_INTERVAL_SECONDS: ${FRAME_EXPORT_HEARTBEAT_INTERVAL_SECONDS:-30}
      FRAME_EXPORT_SOFT_TIME_LIMIT_SECONDS: ${FRAME_EXPORT_SOFT_TIME_LIMIT_SECONDS:-1800}
      FRAME_EXPORT_HARD_TIME_LIMIT_SECONDS: ${FRAME_EXPORT_HARD_TIME_LIMIT_SECONDS:-1860}
      FRAME_EXPORT_S3_CONNECT_TIMEOUT_SECONDS: ${FRAME_EXPORT_S3_CONNECT_TIMEOUT_SECONDS:-5}
      FRAME_EXPORT_S3_READ_TIMEOUT_SECONDS: ${FRAME_EXPORT_S3_READ_TIMEOUT_SECONDS:-30}
      FRAME_EXPORT_MAX_FRAMES: ${FRAME_EXPORT_MAX_FRAMES:-1000}
      FRAME_EXPORT_MAX_TOTAL_BYTES: ${FRAME_EXPORT_MAX_TOTAL_BYTES:-2147483648}
      FRAME_EXPORT_MAX_ZIP_BYTES: ${FRAME_EXPORT_MAX_ZIP_BYTES:-2147483648}
      FRAME_EXPORT_MAX_TEMP_BYTES: ${FRAME_EXPORT_MAX_TEMP_BYTES:-2200000000}
      FRAME_EXPORT_MIN_TEMP_FREE_BYTES: ${FRAME_EXPORT_MIN_TEMP_FREE_BYTES:-268435456}
      FRAME_EXPORT_STALE_TEMP_SECONDS: ${FRAME_EXPORT_STALE_TEMP_SECONDS:-7200}
      IMAGE_DATASET_MAX_IMAGES: ${IMAGE_DATASET_MAX_IMAGES:-1000}
      IMAGE_DATASET_MAX_FILE_BYTES: ${IMAGE_DATASET_MAX_FILE_BYTES:-52428800}
      IMAGE_DATASET_MAX_TOTAL_BYTES: ${IMAGE_DATASET_MAX_TOTAL_BYTES:-2147483648}
      IMAGE_DATASET_MAX_PIXELS: ${IMAGE_DATASET_MAX_PIXELS:-100000000}
      IMAGE_DATASET_MIN_PIXELS: ${IMAGE_DATASET_MIN_PIXELS:-1024}
      IMAGE_DATASET_ZIP_MAX_ENTRIES: ${IMAGE_DATASET_ZIP_MAX_ENTRIES:-1200}
      IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES:-2147483648}
      IMAGE_DATASET_ZIP_MAX_ENTRY_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_ENTRY_COMPRESSED_BYTES:-52428800}
      IMAGE_DATASET_ZIP_MAX_UNCOMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_UNCOMPRESSED_BYTES:-2147483648}
      IMAGE_DATASET_ZIP_MAX_RATIO: ${IMAGE_DATASET_ZIP_MAX_RATIO:-100}
      IMAGE_DATASET_EXPORT_MAX_BYTES: ${IMAGE_DATASET_EXPORT_MAX_BYTES:-2147483648}
      IMAGE_DATASET_NORMAL_SHARPNESS: ${IMAGE_DATASET_NORMAL_SHARPNESS:-100}
      IMAGE_DATASET_UNUSABLE_SHARPNESS: ${IMAGE_DATASET_UNUSABLE_SHARPNESS:-5}
      IMAGE_DATASET_MIN_BRIGHTNESS: ${IMAGE_DATASET_MIN_BRIGHTNESS:-35}
      IMAGE_DATASET_MAX_BRIGHTNESS: ${IMAGE_DATASET_MAX_BRIGHTNESS:-225}
      IMAGE_DATASET_UNUSABLE_BRIGHTNESS: ${IMAGE_DATASET_UNUSABLE_BRIGHTNESS:-5}
      IMAGE_DATASET_SOFT_TIME_LIMIT_SECONDS: ${IMAGE_DATASET_SOFT_TIME_LIMIT_SECONDS:-1800}
      IMAGE_DATASET_HARD_TIME_LIMIT_SECONDS: ${IMAGE_DATASET_HARD_TIME_LIMIT_SECONDS:-1860}
      IMAGE_DATASET_MAX_TEMP_BYTES: ${IMAGE_DATASET_MAX_TEMP_BYTES:-4400000000}
      IMAGE_DATASET_MIN_TEMP_FREE_BYTES: ${IMAGE_DATASET_MIN_TEMP_FREE_BYTES:-268435456}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp/frame-intelligence:mode=1777
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: frame-intelligence-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frame_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-frame_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-frame_user} -d ${POSTGRES_DB:-frame_intelligence}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: frame-intelligence-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: frame-intelligence-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-frame_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        ${MINIO_ROOT_USER:-frame_admin} ${MINIO_ROOT_PASSWORD:-change_me} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-frame-intelligence} &&
        mc anonymous set none local/${MINIO_BUCKET:-frame-intelligence}
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
