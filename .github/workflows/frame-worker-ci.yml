name: Frame Worker CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "services/frame-worker/**"
      - "apps/backend/src/app/api/**"
      - "apps/backend/src/app/core/config.py"
      - "apps/backend/src/app/domain/jobs.py"
      - "apps/backend/src/app/outbox/**"
      - "apps/backend/src/app/services/job_service.py"
      - "apps/backend/src/app/services/result_artifacts.py"
      - "apps/backend/src/app/schemas/**"
      - "apps/backend/migrations/**"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".env.example"
      - ".env.production.example"
      - ".github/workflows/frame-worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/frame-worker/**"
      - "apps/backend/src/app/api/**"
      - "apps/backend/src/app/core/config.py"
      - "apps/backend/src/app/domain/jobs.py"
      - "apps/backend/src/app/outbox/**"
      - "apps/backend/src/app/services/job_service.py"
      - "apps/backend/src/app/services/result_artifacts.py"
      - "apps/backend/src/app/schemas/**"
      - "apps/backend/migrations/**"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".env.example"
      - ".env.production.example"
      - ".github/workflows/frame-worker-ci.yml"

jobs:
  worker-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: frame_intelligence_test
          POSTGRES_USER: frame_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frame_user -d frame_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OBJECT_STORAGE_INTEGRATION: "1"
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: frame_admin
      OBJECT_STORAGE_SECRET_KEY: test_password
      OBJECT_STORAGE_BUCKET: frame-intelligence-test
      DATABASE_URL: postgresql+psycopg://frame_user:test_password@localhost:5432/frame_intelligence_test
      TEST_DATABASE_URL: postgresql+psycopg://frame_user:test_password@localhost:5432/frame_intelligence_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      JOB_SOURCE_ENCRYPTION_KEY: VFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFQ=
    defaults:
      run:
        working-directory: services/frame-worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --dev
      - name: Audit locked production dependencies
        run: |
          requirements_file="${RUNNER_TEMP}/frame-worker-requirements.txt"
          uv export --locked --no-dev --no-emit-project \
            --format requirements-txt --output-file "${requirements_file}"
          grep -Eq '^pillow==12\.3\.0([[:space:]]|$)' "${requirements_file}"
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement "${requirements_file}"
      - name: Apply database migrations
        working-directory: apps/backend
        run: |
          uv sync --locked --dev
          uv run alembic upgrade head
      - name: Start MinIO
        run: >-
          docker run -d --name frame-intelligence-ci-minio
          -p 9000:9000
          -e MINIO_ROOT_USER=frame_admin
          -e MINIO_ROOT_PASSWORD=test_password
          minio/minio:latest server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            curl --fail http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          exit 1
      - run: uv run ruff check src tests
      - run: uv run pytest
      - name: Stop task-scoped MinIO
        if: always()
        run: docker rm -f frame-intelligence-ci-minio || true

  async-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: frame_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frame_user -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ASYNC_E2E_INTEGRATION: "1"
      OBJECT_STORAGE_INTEGRATION: "1"
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: frame_admin
      OBJECT_STORAGE_SECRET_KEY: test_password
      DATABASE_URL: postgresql+psycopg://frame_user:test_password@localhost:5432/postgres
      TEST_DATABASE_ADMIN_URL: postgresql://frame_user:test_password@localhost:5432/postgres
      CELERY_BROKER_URL: redis://localhost:6379/0
      PYTHONDONTWRITEBYTECODE: "1"
      ASYNC_CLEANUP_RECEIPT: ${{ runner.temp }}/issue35-cleanup.receipt
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - name: Install worker and backend dependencies
        run: |
          uv sync --project services/frame-worker --locked --dev
          uv sync --project apps/backend --locked --dev
      - name: Start task-scoped MinIO
        run: >-
          docker run -d --name issue35-async-minio
          -p 9000:9000
          -e MINIO_ROOT_USER=frame_admin
          -e MINIO_ROOT_PASSWORD=test_password
          minio/minio:latest server /data
      - name: Wait for task-scoped MinIO
        run: |
          for attempt in {1..30}; do
            curl --fail http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          exit 1
      - name: Run isolated full integration suite with no skips
        run: uv run --project services/frame-worker python services/frame-worker/scripts/run_async_integration.py
      - name: Verify harness cleanup
        if: always()
        run: |
          docker rm -f issue35-async-minio || true
          uv run --project services/frame-worker python services/frame-worker/scripts/verify_async_cleanup.py
          test -z "$(docker ps -aq --filter 'name=issue35-')"
          test -z "$(find "${RUNNER_TEMP}" -maxdepth 1 -name 'issue35-*' -print -quit)"
