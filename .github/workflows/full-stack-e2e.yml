name: Full-stack system E2E

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "services/frame-worker/**"
      - "compose.yaml"
      - ".github/workflows/full-stack-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "services/frame-worker/**"
      - "compose.yaml"
      - ".github/workflows/full-stack-e2e.yml"
  workflow_dispatch:

concurrency:
  group: full-stack-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    env:
      FULL_STACK_E2E_PROJECT: framee2e_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run isolated real full-stack flow
        run: npm run test:full-stack-e2e
      - name: Bounded redacted diagnostics
        if: failure()
        run: npm run test:full-stack-e2e -- --diagnostics-only
      - name: Remove only this run's Compose resources
        if: always()
        run: npm run test:full-stack-e2e -- --cleanup-only
