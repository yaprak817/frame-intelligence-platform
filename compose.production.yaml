name: frame-intelligence-production

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
  JOB_SOURCE_ENCRYPTION_KEY: ${JOB_SOURCE_ENCRYPTION_KEY:?required}
  CELERY_BROKER_URL: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOW_ORIGINS: '[]'
  CORS_ALLOW_CREDENTIALS: "false"
  # Next.js deliberately strips inbound forwarding headers, so no Docker peer is trusted.
  TRUSTED_PROXY_CIDRS: '[]'
  INTERNAL_PROXY_SHARED_SECRET: ${INTERNAL_PROXY_SHARED_SECRET:?required}
  RATE_LIMIT_SUBMISSION_REQUESTS: ${RATE_LIMIT_SUBMISSION_REQUESTS:-10}
  RATE_LIMIT_RESULT_REQUESTS: ${RATE_LIMIT_RESULT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-3}
  FRAME_EXPORT_MAX_FRAMES: ${FRAME_EXPORT_MAX_FRAMES:-1000}
  FRAME_EXPORT_MAX_TOTAL_BYTES: ${FRAME_EXPORT_MAX_TOTAL_BYTES:-2147483648}
  IMAGE_DATASET_MAX_FILES: ${IMAGE_DATASET_MAX_FILES:-1000}
  IMAGE_DATASET_MAX_FILE_BYTES: ${IMAGE_DATASET_MAX_FILE_BYTES:-52428800}
  IMAGE_DATASET_MAX_TOTAL_BYTES: ${IMAGE_DATASET_MAX_TOTAL_BYTES:-2147483648}
  IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES:-2147483648}
  RESULT_ARTIFACT_SPOOL_MIN_FREE_BYTES: ${RESULT_ARTIFACT_SPOOL_MIN_FREE_BYTES:-268435456}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_EXTERNAL_ENDPOINT: ${OBJECT_STORAGE_EXTERNAL_ENDPOINT:?required}
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
  OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:?required}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_ADDRESSING_STYLE: path
  OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
  OUTBOX_BACKOFF_BASE_SECONDS: ${OUTBOX_BACKOFF_BASE_SECONDS:-1}
  OUTBOX_BACKOFF_MAX_SECONDS: ${OUTBOX_BACKOFF_MAX_SECONDS:-60}
  MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-60}

services:
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      APP_SITE: ${APP_SITE:?required}
      STORAGE_SITE: ${STORAGE_SITE:?required}
    ports:
      - "${PROXY_HTTP_BIND:-80}:80"
      - "${PROXY_HTTPS_BIND:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend-edge, storage-edge]
    depends_on:
      frontend: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: {context: ./apps/frontend}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      API_PROXY_TIMEOUT_SECONDS: ${API_PROXY_TIMEOUT_SECONDS:-30}
      UPLOAD_PROXY_TIMEOUT_SECONDS: ${UPLOAD_PROXY_TIMEOUT_SECONDS:-1800}
      INTERNAL_PROXY_SHARED_SECRET: ${INTERNAL_PROXY_SHARED_SECRET:?required}
      IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES:-2147483648}
    expose: ["3000"]
    networks: [frontend-edge, application]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: {context: ./apps/backend}
    command: ["python", "-m", "app.db.migrate"]
    environment: *backend-environment
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  backend:
    build: {context: ./apps/backend}
    environment: *backend-environment
    command: ["/bin/sh", "-ec", "exec uvicorn app.main:app --host \"$(getent hosts backend-http | awk '{print $1; exit}')\" --port 8000"]
    expose: ["8000"]
    networks:
      application: {aliases: [backend-http]}
      data:
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://backend-http:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  outbox-publisher:
    build: {context: ./apps/backend}
    command: ["python", "-m", "app.outbox.publisher"]
    environment: *backend-environment
    networks: [data]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  frame-worker:
    build: {context: ./services/frame-worker}
    command: ["celery", "--quiet", "-A", "frame_worker.orchestration.celery_app:celery_app", "worker", "--loglevel=WARNING", "--queues=video-processing"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      CELERY_BROKER_URL: redis://redis:6379/0
      JOB_SOURCE_ENCRYPTION_KEY: ${JOB_SOURCE_ENCRYPTION_KEY:?required}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:?required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ADDRESSING_STYLE: path
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-2147483648}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-900}
      JOB_HEARTBEAT_INTERVAL_SECONDS: ${JOB_HEARTBEAT_INTERVAL_SECONDS:-60}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-7200}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      PROCESSING_TEMP_ROOT: /tmp/frame-intelligence
      FRAME_EXPORT_LEASE_SECONDS: ${FRAME_EXPORT_LEASE_SECONDS:-300}
      FRAME_EXPORT_HEARTBEAT_INTERVAL_SECONDS: ${FRAME_EXPORT_HEARTBEAT_INTERVAL_SECONDS:-30}
      FRAME_EXPORT_SOFT_TIME_LIMIT_SECONDS: ${FRAME_EXPORT_SOFT_TIME_LIMIT_SECONDS:-1800}
      FRAME_EXPORT_HARD_TIME_LIMIT_SECONDS: ${FRAME_EXPORT_HARD_TIME_LIMIT_SECONDS:-1860}
      FRAME_EXPORT_S3_CONNECT_TIMEOUT_SECONDS: ${FRAME_EXPORT_S3_CONNECT_TIMEOUT_SECONDS:-5}
      FRAME_EXPORT_S3_READ_TIMEOUT_SECONDS: ${FRAME_EXPORT_S3_READ_TIMEOUT_SECONDS:-30}
      FRAME_EXPORT_MAX_FRAMES: ${FRAME_EXPORT_MAX_FRAMES:-1000}
      FRAME_EXPORT_MAX_TOTAL_BYTES: ${FRAME_EXPORT_MAX_TOTAL_BYTES:-2147483648}
      FRAME_EXPORT_MAX_ZIP_BYTES: ${FRAME_EXPORT_MAX_ZIP_BYTES:-2147483648}
      FRAME_EXPORT_MAX_TEMP_BYTES: ${FRAME_EXPORT_MAX_TEMP_BYTES:-2200000000}
      FRAME_EXPORT_MIN_TEMP_FREE_BYTES: ${FRAME_EXPORT_MIN_TEMP_FREE_BYTES:-268435456}
      FRAME_EXPORT_STALE_TEMP_SECONDS: ${FRAME_EXPORT_STALE_TEMP_SECONDS:-7200}
      IMAGE_DATASET_MAX_IMAGES: ${IMAGE_DATASET_MAX_IMAGES:-1000}
      IMAGE_DATASET_MAX_FILE_BYTES: ${IMAGE_DATASET_MAX_FILE_BYTES:-52428800}
      IMAGE_DATASET_MAX_TOTAL_BYTES: ${IMAGE_DATASET_MAX_TOTAL_BYTES:-2147483648}
      IMAGE_DATASET_MAX_PIXELS: ${IMAGE_DATASET_MAX_PIXELS:-100000000}
      IMAGE_DATASET_MIN_PIXELS: ${IMAGE_DATASET_MIN_PIXELS:-1024}
      IMAGE_DATASET_ZIP_MAX_ENTRIES: ${IMAGE_DATASET_ZIP_MAX_ENTRIES:-1200}
      IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_COMPRESSED_BYTES:-2147483648}
      IMAGE_DATASET_ZIP_MAX_ENTRY_COMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_ENTRY_COMPRESSED_BYTES:-52428800}
      IMAGE_DATASET_ZIP_MAX_UNCOMPRESSED_BYTES: ${IMAGE_DATASET_ZIP_MAX_UNCOMPRESSED_BYTES:-2147483648}
      IMAGE_DATASET_ZIP_MAX_RATIO: ${IMAGE_DATASET_ZIP_MAX_RATIO:-100}
      IMAGE_DATASET_EXPORT_MAX_BYTES: ${IMAGE_DATASET_EXPORT_MAX_BYTES:-2147483648}
      IMAGE_DATASET_NORMAL_SHARPNESS: ${IMAGE_DATASET_NORMAL_SHARPNESS:-100}
      IMAGE_DATASET_UNUSABLE_SHARPNESS: ${IMAGE_DATASET_UNUSABLE_SHARPNESS:-5}
      IMAGE_DATASET_MIN_BRIGHTNESS: ${IMAGE_DATASET_MIN_BRIGHTNESS:-35}
      IMAGE_DATASET_MAX_BRIGHTNESS: ${IMAGE_DATASET_MAX_BRIGHTNESS:-225}
      IMAGE_DATASET_UNUSABLE_BRIGHTNESS: ${IMAGE_DATASET_UNUSABLE_BRIGHTNESS:-5}
      IMAGE_DATASET_SOFT_TIME_LIMIT_SECONDS: ${IMAGE_DATASET_SOFT_TIME_LIMIT_SECONDS:-1800}
      IMAGE_DATASET_HARD_TIME_LIMIT_SECONDS: ${IMAGE_DATASET_HARD_TIME_LIMIT_SECONDS:-1860}
      IMAGE_DATASET_MAX_TEMP_BYTES: ${IMAGE_DATASET_MAX_TEMP_BYTES:-4400000000}
      IMAGE_DATASET_MIN_TEMP_FREE_BYTES: ${IMAGE_DATASET_MIN_TEMP_FREE_BYTES:-268435456}
    networks: [data]
    depends_on:
      backend: {condition: service_healthy}
    tmpfs: [/tmp/frame-intelligence:mode=1777]
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: [minio_data:/data]
    networks: [storage-edge, data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:?required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" >/dev/null
        mc anonymous set none "local/$${MINIO_BUCKET}" >/dev/null
    networks: [data]
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

networks:
  frontend-edge:
  storage-edge:
  application: {internal: true}
  data: {internal: true}

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
